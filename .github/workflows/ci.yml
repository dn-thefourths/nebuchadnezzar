name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Python syntax
        run: python3 -m py_compile matrix-splash.py

      - name: Ruff lint
        run: pipx run ruff check matrix-splash.py

      - name: Check bash syntax
        run: |
          bash -n install.sh
          bash -n bashrc-snippet.bash

      - name: ShellCheck
        run: shellcheck install.sh bashrc-snippet.bash
